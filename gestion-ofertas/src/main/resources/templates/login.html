<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/header :: header('Login - Viajes SolParaiso')}"></th:block>

    <style>
        body {
            background: radial-gradient(circle at 10% 20%, rgb(255, 197, 61) 0%, rgb(255, 94, 7) 90%);
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 300px;
        }

        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            max-width: 400px;
            width: 100%;
        }

        .login-header {
            background: linear-gradient(135deg, #ff8c00 0%, #ff5e07 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .login-header i {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .login-header img {
            max-width: 100%;
            height: auto;
        }

        .login-body {
            padding: 2rem;
        }

        .form-control:focus {
            border-color: #ff8c00;
            box-shadow: 0 0 0 0.2rem rgba(255, 140, 0, 0.25);
        }

        .btn-login {
            background: linear-gradient(135deg, #ffb347 0%, #ff5e07 100%);
            border: none;
            padding: 0.75rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 140, 0, 0.4);
        }

        .credentials-info {
            background-color: #faf9f8;
            border-left: 4px solid #ff8c00;
            padding: 1rem;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        /* Botón mostrar/ocultar contraseña */
        #togglePassword:hover {
            background-color: #ff8c00;
            color: white;
            border-color: #ff8c00;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .login-container {
                margin-left: 0;
                padding: 1rem;
            }

            .login-card {
                margin: 0 10px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="login-card">

                    <!-- HEADER -->
                    <div class="login-header">
                        <img th:src="@{/img/LogoAlargado.jpg}" alt="Logo">
                        <h3>Inicio de Sesión</h3>

                    </div>

                    <!-- BODY -->
                    <div class="login-body">

                        <!-- Mensaje Error -->
                        <div th:if="${error}" class="alert alert-danger" role="alert">
                            <i class="bi bi-exclamation-triangle"></i>
                            <span th:text="${error}">Error</span>
                        </div>

                        <!-- Mensaje Éxito -->
                        <div th:if="${mensaje}" class="alert alert-success" role="alert">
                            <i class="bi bi-check-circle"></i>
                            <span th:text="${mensaje}">Mensaje</span>
                        </div>

                        <!-- FORMULARIO -->
                        <form th:action="@{/login}" method="post">

                            <!-- EMAIL -->
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    <i class="bi bi-person"></i> Usuario
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="email"
                                       name="email"
                                       placeholder="Ingrese su email"
                                       required
                                       autofocus>
                            </div>

                            <!-- PASSWORD -->
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="bi bi-lock"></i> Contraseña
                                </label>

                                <div class="input-group">

                                    <input type="password"
                                           class="form-control"
                                           id="password"
                                           name="password"
                                           placeholder="Ingrese su contraseña"
                                           required>

                                    <button class="btn btn-outline-secondary"
                                            type="button"
                                            id="togglePassword">

                                        <i class="bi bi-eye"></i>

                                    </button>

                                </div>
                            </div>

                            <!-- BOTÓN LOGIN -->
                            <button type="submit" class="btn btn-primary btn-login w-100">
                                <i class="bi bi-box-arrow-in-right"></i>
                                Iniciar Sesión
                            </button>

                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!--  MOSTRAR / OCULTAR PASSWORD -->
<script>
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');
    const icon = togglePassword.querySelector('i');

    togglePassword.addEventListener('click', function () {

        const type = password.getAttribute('type') === 'password'
            ? 'text'
            : 'password';

        password.setAttribute('type', type);

        icon.classList.toggle('bi-eye');
        icon.classList.toggle('bi-eye-slash');
    });
</script>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

</body>
</html>
