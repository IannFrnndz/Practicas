<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <th:block th:replace="~{fragments/header :: header('Dashboard - Gestion de Ofertas')}"></th:block>

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        body{
            font-family: 'Inter', sans-serif;
            background: #f4f7fb;
        }

        .main-content{
            padding-top: 30px;
            padding-bottom: 40px;
        }

        /* CARD PRINCIPAL */
        .dashboard-card{
            background: white;
            border-radius: 24px;
            padding: 32px;
            box-shadow:
                    0 10px 25px rgba(0,0,0,.06),
                    0 2px 10px rgba(0,0,0,.04);
        }

        /* HEADER */
        .page-title{
            font-weight: 700;
            color: #111827;
            margin-bottom: 10px;
        }

        .page-subtitle{
            color: #6b7280;
            font-size: 17px;
            margin-bottom: 0;
        }

        /* SECTION */
        .section-card{
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 22px;
            overflow: hidden;
        }

        .section-header{
            padding: 20px 24px;
            background: #111827;
            color: white;
            font-weight: 600;
            font-size: 16px;
        }

        .section-body{
            padding: 30px;
        }

        /* QUICK ACTIONS */
        .quick-action{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border-radius: 22px;
            padding: 35px 25px;
            transition: all .25s ease;
            border: none;
            height: 100%;
        }

        .quick-action:hover{
            transform: translateY(-4px);
        }

        .quick-action i{
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .quick-action p{
            margin: 0;
            font-weight: 600;
            font-size: 16px;
        }

        /* ACTION WARNING */
        .action-warning{
            background: rgba(245,158,11,.10);
            color: #d97706;
            box-shadow: 0 8px 20px rgba(245,158,11,.10);
        }

        .action-warning:hover{
            background: rgba(245,158,11,.16);
            color: #b45309;
            box-shadow: 0 12px 25px rgba(245,158,11,.18);
        }

        /* ACTION SUCCESS */
        .action-success{
            background: rgba(34,197,94,.10);
            color: #16a34a;
            box-shadow: 0 8px 20px rgba(34,197,94,.12);
        }

        .action-success:hover{
            background: rgba(34,197,94,.16);
            color: #15803d;
            box-shadow: 0 12px 25px rgba(34,197,94,.18);
        }

        /* MOBILE */
        @media (max-width: 768px){

            .dashboard-card{
                padding: 20px;
            }

            .section-body{
                padding: 20px;
            }

            .quick-action{
                padding: 28px 20px;
            }

        }

    </style>

</head>

<body>

<!-- NAVBAR -->
<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

<!-- CONTENIDO PRINCIPAL -->
<div class="main-content">

    <div class="container">

        <div class="dashboard-card">

            <!-- HEADER -->
            <div class="mb-4">

                <h1 class="page-title">

                    <i class="bi bi-speedometer2"></i>
                    Dashboard

                </h1>

                <p class="page-subtitle">

                    Bienvenido,
                    <strong th:text="${usuario.nombre}">
                        Usuario
                    </strong>

                </p>

            </div>

            <!-- ACCESOS RÁPIDOS -->
            <div class="section-card">

                <div class="section-header">

                    <i class="bi bi-lightning"></i>
                    Accesos Rápidos

                </div>

                <div class="section-body">

                    <div class="row justify-content-center g-4">

                        <!-- VER OFERTAS -->
                        <div class="col-md-5">

                            <a href="/ofertas/"
                               class="quick-action action-warning">

                                <i class="bi bi-list-ul"></i>

                                <p>
                                    Ver Todas las Ofertas
                                </p>

                            </a>

                        </div>

                        <!-- NUEVA OFERTA -->
                        <div class="col-md-5">

                            <a href="/ofertas/nueva"
                               class="quick-action action-success">

                                <i class="bi bi-folder-plus"></i>

                                <p>
                                    Nueva Oferta
                                </p>

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- FOOTER -->
<th:block th:replace="~{fragments/footer :: footer}"></th:block>

</body>
</html>
