<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <th:block th:replace="~{fragments/header :: header('Formulario Oferta')}"></th:block>

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        body{
            font-family: 'Inter', sans-serif;
            background: #f4f7fb;
        }

        .main-content{
            padding-top: 30px;
            padding-bottom: 40px;
        }

        /* CARD PRINCIPAL */
        .offer-card{
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow:
                    0 10px 25px rgba(0,0,0,.06),
                    0 2px 10px rgba(0,0,0,.04);
        }

        /* TITULO */
        .page-title{
            font-weight: 700;
            color: #111827;
            margin-bottom: 0;
        }

        .page-subtitle{
            color: #6b7280;
            margin-top: 6px;
        }

        /* ALERTA */
        .alert{
            border: none;
            border-radius: 18px;
            padding: 16px 20px;
            font-weight: 500;
        }

        .alert-danger{
            background: rgba(239,68,68,.12);
            color: #b91c1c;
        }

        /* BOXES */
        .section-box{
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .section-title{
            font-size: 18px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 18px;
        }

        /* INPUTS */
        .form-label{
            font-weight: 600;
            color: #374151;
            margin-bottom: 10px;
        }

        .form-control,
        .form-select{
            border-radius: 14px;
            min-height: 50px;
            border: 1px solid #dbe3ec;
            transition: all .2s ease;
            box-shadow: none;
        }

        textarea.form-control{
            min-height: 130px;
            resize: vertical;
        }

        .form-control:focus,
        .form-select:focus{
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99,102,241,.15);
        }

        /* BOTONES */
        .btn{
            border: none;
            border-radius: 14px;
            padding: 12px 20px;
            font-weight: 600;
            transition: all .25s ease;
        }

        .btn:hover{
            transform: translateY(-2px);
        }

        .btn-primary{
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 8px 20px rgba(37,99,235,.22);
        }

        .btn-primary:hover{
            box-shadow: 0 12px 24px rgba(37,99,235,.30);
        }

        .btn-success{
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 8px 20px rgba(34,197,94,.25);
        }

        .btn-success:hover{
            box-shadow: 0 12px 25px rgba(34,197,94,.35);
        }

        .btn-secondary{
            background: #e5e7eb;
            color: #374151;
        }

        .btn-secondary:hover{
            background: #d1d5db;
            color: #111827;
        }

        /* MOBILE */
        @media (max-width: 768px){

            .offer-card{
                padding: 20px;
            }

            .d-flex.justify-content-between{
                flex-direction: column;
                gap: 12px;
            }

            .d-flex.justify-content-between .btn{
                width: 100%;
            }

        }

    </style>

</head>

<body>

<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

<div class="main-content">

    <div class="container">

        <div class="offer-card">

            <!-- HEADER -->
            <div class="mb-4">

                <h1 class="page-title">

                    <i class="bi bi-file-earmark-plus"></i>

                    <span th:if="${oferta.id == null}">
                        Nueva Oferta
                    </span>

                    <span th:unless="${oferta.id == null}">
                        Editar Oferta
                    </span>

                </h1>

                <p class="page-subtitle">
                    Completa la información de la oferta y guarda los cambios.
                </p>

            </div>

            <!-- ERROR -->
            <div th:if="${error}"
                 class="alert alert-danger">

                <span th:text="${error}"></span>

            </div>

            <!-- FORMULARIO PDF + IA -->
            <div class="section-box">

                <h5 class="section-title">

                    <i class="bi bi-file-earmark-pdf"></i>
                    Analizar PDF con IA

                </h5>

                <form action="/ofertas/probar-pdf"
                      method="post"
                      enctype="multipart/form-data">

                    <!-- CSRF TOKEN -->
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <div class="mb-3">

                        <label class="form-label">
                            Subir PDF de oferta
                        </label>

                        <input type="file"
                               name="file"
                               class="form-control"
                               accept=".pdf"
                               required>

                    </div>

                    <button type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-file-earmark-pdf"></i>
                        Analizar PDF con IA

                    </button>

                </form>

            </div>

            <!-- FORMULARIO NORMAL -->
            <div class="section-box">

                <h5 class="section-title">

                    <i class="bi bi-pencil-square"></i>
                    Información de la oferta

                </h5>

                <form th:action="@{/ofertas/guardar}"
                      th:object="${oferta}"
                      method="post">

                    <input type="hidden" th:field="*{id}" />
                    <input type="hidden" th:field="*{fechaCreacion}" />
                    <input type="hidden" th:field="*{estado}" />

                    <div class="mb-3">

                        <label class="form-label">
                            Título <span class="text-danger">*</span>
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{titulo}"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Descripción
                        </label>

                        <textarea class="form-control"
                                  rows="5"
                                  th:field="*{descripcion}">
                        </textarea>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Precio <span class="text-danger">*</span>
                            </label>

                            <input type="number"
                                   step="0.01"
                                   class="form-control"
                                   th:field="*{precio}"
                                   required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Fecha de Validez
                            </label>

                            <input type="date"
                                   class="form-control"
                                   th:field="*{fechaValidez}">

                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Categoría <span class="text-danger">*</span>
                        </label>

                        <select class="form-select"
                                th:field="*{categoria}"
                                required>

                            <option value="" disabled selected>
                                Selecciona una categoría
                            </option>

                            <option th:each="cat : ${categorias}"
                                    th:value="${cat}"
                                    th:text="${#strings.capitalize(cat.name().toLowerCase())}">
                            </option>

                        </select>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            URL Imagen
                        </label>

                        <input type="url"
                               class="form-control"
                               th:field="*{imagenUrl}"
                               placeholder="https://...">

                    </div>

                    <div class="d-flex justify-content-between">

                        <a href="/ofertas"
                           class="btn btn-secondary">

                            <i class="bi bi-x-circle"></i>
                            Cancelar

                        </a>

                        <button type="submit"
                                class="btn btn-success">

                            <i class="bi bi-save"></i>
                            Guardar

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

</body>
</html>
