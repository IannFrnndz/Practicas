<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/header :: header('Listado de Ofertas')}"></th:block>

    <style>
        /* Ajustes solo para móvil */
        @media (max-width: 768px) {

            /* Header en columna */
            .header-responsive {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            /* Botones de acciones en columna */
            td.text-end {
                white-space: nowrap;
            }

            td.text-end .btn {
                display: block;
                width: 100%;
                margin-bottom: 5px;
            }

            td.text-end form {
                display: block !important;
            }
        }

        /* Separación visual entre botones */
        .btn-publicar {
            margin-top: 5px;
        }
    </style>
</head>
<body>

<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

<div class="main-content">
    <div class="container">

        <!-- Header responsive -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-2">
            <h1 class="display-6">Ofertas</h1>

            <a href="/ofertas/nueva" class="btn btn-success">
                <i class="bi bi-plus-circle"></i> Nueva oferta
            </a>
        </div>

        <!-- Tabla responsive -->
        <div class="table-responsive">
            <table class="table table-hover">

                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Precio</th>
                    <th>Fecha Validez</th>
                    <th>Estado</th>
                    <th>Categoria</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="oferta : ${ofertas}">

                    <td th:text="${oferta.id}">1</td>

                    <td th:text="${oferta.titulo}">Oferta</td>

                    <td th:text="${oferta.precio}">0.00€</td>

                    <td th:text="${#temporals.format(oferta.fechaValidez, 'dd/MM/yyyy')}"></td>

                    <!-- ESTADO -->
                    <td>

                        <span th:if="${oferta.estado != null and oferta.estado.name() == 'PUBLICADA'}"
                              class="badge bg-success">

                            <i class="bi bi-check-circle"></i> Publicada

                        </span>

                        <span th:if="${oferta.estado == null or oferta.estado.name() == 'BORRADOR'}"
                              class="badge bg-warning">

                            <i class="bi bi-clock"></i> Borrador

                        </span>

                    </td>

                    <!-- CATEGORIA -->
                    <td th:text="${oferta.categoria}"></td>

                    <!-- ACCIONES -->
                    <td class="text-end">

                        <!-- VER -->
                        <a th:href="@{/ofertas/{id}(id=${oferta.id})}"
                           class="btn btn-primary btn-sm"
                           title="Ver oferta">

                            <i class="bi bi-eye"></i>

                        </a>

                        <!-- EDITAR -->
                        <a th:href="@{/ofertas/editar/{id}(id=${oferta.id})}"
                           class="btn btn-warning btn-sm"
                           title="Editar oferta">

                            <i class="bi bi-pencil-square"></i>

                        </a>

                        <!-- PUBLICAR -->
                        <a th:if="${oferta.estado.name() == 'BORRADOR'}"
                           th:href="@{/ofertas/publicar/{id}(id=${oferta.id})}"
                           class="btn btn-success btn-sm "
                           title="Publicar oferta">

                            <i class="bi bi-upload"></i>

                        </a>

                        <!-- DESPUBLICAR -->
                        <a th:if="${oferta.estado.name() == 'PUBLICADA'}"
                           th:href="@{/ofertas/despublicar/{id}(id=${oferta.id})}"
                           class="btn btn-secondary btn-sm"
                           title="Despublicar oferta">

                            <i class="bi bi-pause"></i>

                        </a>

                        <!-- ELIMINAR -->
                        <form th:action="@{/ofertas/eliminar/{id}(id=${oferta.id})}"
                              method="post"
                              style="display:inline;"
                              onsubmit="return confirm('¿Eliminar esta oferta?');">

                            <button class="btn btn-danger btn-sm"
                                    title="Eliminar oferta">

                                <i class="bi bi-trash"></i>

                            </button>

                        </form>

                    </td>

                </tr>

                </tbody>

            </table>
        </div>

    </div>

</div>
<!-- PAGINACIÓN -->
<nav th:if="${totalPages > 1}">
    <ul class="pagination justify-content-center">

        <!-- Anterior -->
        <li class="page-item"
            th:classappend="${currentPage == 0} ? 'disabled'">

            <a class="page-link"
               th:href="@{/ofertas(page=${currentPage - 1})}">

                Anterior

            </a>
        </li>

        <!-- Números -->
        <li class="page-item"
            th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
            th:classappend="${i == currentPage} ? 'active'">

            <a class="page-link"
               th:href="@{/ofertas(page=${i})}"
               th:text="${i + 1}">

            </a>
        </li>

        <!-- Siguiente -->
        <li class="page-item"
            th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">

            <a class="page-link"
               th:href="@{/ofertas(page=${currentPage + 1})}">

                Siguiente

            </a>
        </li>

    </ul>
</nav>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

</body>
</html>
