<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="header(title)">

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title th:text="${title}">
    Viajes SolParaiso
  </title>

  <!-- GOOGLE FONT -->
  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

  <!-- BOOTSTRAP CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <!-- BOOTSTRAP ICONS -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

  <!-- ESTILOS PERSONALIZADOS -->
  <style>

    :root {

      /* NUEVA PALETA NARANJA */
      --primary-color: #fb923c;
      --primary-dark: #f97316;
      --primary-light: #fed7aa;

      --secondary-color: #6b7280;
      --success-color: #22c55e;
      --danger-color: #ef4444;
      --warning-color: #f59e0b;
      --info-color: #38bdf8;

    }

    body{
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Inter', sans-serif;
      background: #f4f7fb;
    }

    /* NAVBAR */
    .navbar{
      background: linear-gradient(135deg,
      var(--primary-color),
      var(--primary-dark)) !important;

      box-shadow:
              0 8px 24px rgba(249,115,22,.18),
              0 2px 8px rgba(0,0,0,.05);

      padding-top: 14px;
      padding-bottom: 14px;
    }

    .navbar .navbar-brand,
    .navbar .nav-link,
    .navbar .dropdown-toggle{
      color: white !important;
      font-weight: 500;
      transition: all .2s ease;
    }

    .navbar .nav-link:hover,
    .navbar .dropdown-toggle:hover{
      opacity: .85;
    }

    /* CONTENIDO */
    .main-content{
      flex: 1;
      padding: 2rem 0;
      background-color: #f4f7fb;
    }

    /* CARDS */
    .card{
      border: none;
      border-radius: 22px;
      overflow: hidden;

      box-shadow:
              0 10px 25px rgba(0,0,0,.06),
              0 2px 10px rgba(0,0,0,.04);

      margin-bottom: 1.5rem;
    }

    .card-header{
      background: linear-gradient(135deg,
      var(--primary-color),
      var(--primary-dark));

      color: white;
      font-weight: 600;
      border: none;
      padding: 18px 22px;
    }

    /* BADGES */
    .badge-role{
      font-size: 0.85rem;
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
    }

    /* BOTONES */
    .btn{
      border-radius: 14px;
      font-weight: 600;
      transition: all .25s ease;
      border: none;
    }

    .btn:hover{
      transform: translateY(-2px);
    }

    .btn-primary{
      background: linear-gradient(135deg,
      var(--primary-color),
      var(--primary-dark));

      box-shadow: 0 8px 20px rgba(249,115,22,.20);
    }

    .btn-primary:hover{
      box-shadow: 0 12px 24px rgba(249,115,22,.28);
    }

    .btn-action{
      margin: 0.2rem;
    }

    /* TABLAS */
    .table{
      vertical-align: middle;
    }

    .table-hover tbody tr{
      transition: all .2s ease;
    }

    .table-hover tbody tr:hover{
      background-color: rgba(249,115,22,.06);
    }

    /* FOOTER */
    footer{
      background: #111827;
      color: white;
      padding: 1rem 0;
      margin-top: auto;
    }

    /* ALERTAS */
    .alert{
      margin-top: 1rem;
      border: none;
      border-radius: 16px;
      padding: 16px 20px;
    }

    .alert-success{
      background: rgba(34,197,94,.12);
      color: #15803d;
    }

    .alert-danger{
      background: rgba(239,68,68,.12);
      color: #b91c1c;
    }

    .alert-warning{
      background: rgba(245,158,11,.14);
      color: #b45309;
    }

    .alert-info{
      background: rgba(56,189,248,.12);
      color: #0369a1;
    }

  </style>

</head>
</html>
